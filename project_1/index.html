
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kedai Bakso</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
     <div class="logo">
        <img src="logo.png" alt="Logo Kedai Bakso">
        <h1>Kedai Bakso</h1>
    </div>
    
    <nav>
        <a href="#menu">Menu</a>
        <a href="#kontak">Pesan</a>
    </nav>
</header>

<main>
    <section class="isi">
        <div>
            <h2>Bakso Enak, Harga Bersahabat!</h2>
            <p>Nikmati bakso hangat dan lezat setiap hari.
            <br>karena bakso ini dibuat dengan daging sapi pilihan <br>
                 juga dari bumbu yang berkualitas.
            </p>
        </div>
        <img src="foto_samping.png"
             alt="Foto bakso">
        
        
    </section>

    <section id="menu">
    <h2>Menu Kami</h2>

    <div class="menu">
        <div>
            <img src="foto_baksobiasa.png" alt="Bakso Biasa">
            <h3>Bakso Biasa</h3>
            <p>Rp15.000</p>
        </div>

        <div>
            <img src="bakso_spesial.png" alt="Bakso Spesial">
            <h3>Bakso Spesial</h3>
            <p>Rp20.000</p>
        </div>
    </div>
</section>

    <section id="kontak">
        <h2>Pesan Sekarang</h2>
        <form>
            <input type="text" placeholder="Nama kamu" required>
            <input type="email" placeholder="Email kamu" required>

            <select required>
                <option value="">Pilih menu</option>
                <option>Bakso Biasa</option>
                <option>Bakso Spesial</option>
            </select>

            <textarea placeholder="Catatan pesanan"></textarea>
            <button type="submit">Kirim Pesanan</button>
        </form>
    </section>
</main>

<footer>
    <p>&copy; 2026 Kedai Bakso</p>
</footer>

</body>
</html>
